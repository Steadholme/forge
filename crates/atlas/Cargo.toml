[package]
name = "atlas"
version = "0.1.0"
edition = "2021"
description = "Atlas — infrastructure catalog & topology map for the HOLDFAST estate."
license = "MIT OR Apache-2.0"

[lib]
name = "atlas"
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
# Odyssey canonical design-system CSS (vendored, path dep). Atlas's own service.css layers after it.
odyssey = { path = "../odyssey" }
# HTTP framework (shared with the rest of the estate): Form/State/Path/Json extractors.
axum = "0.8"
# Async runtime axum runs on. The Store/RoutesSource traits are async: handlers `.await` them
# directly and the Pg layers drive sqlx natively, so a worker thread is NEVER blocked. The audit
# emitter + the Beacon fetch use `net`/`io-util`/`time` over a raw TCP socket (no HTTP client).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async trait methods so `Arc<dyn Store>` / `Arc<dyn RoutesSource>` stay object-safe —
# an in-memory fake and a Pg-backed impl drop in interchangeably behind the same seam.
async-trait = "0.1"
# Deserialize the annotate form body + the Beacon status JSON; serialize the inventory / audit JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> branded HTML error page / JSON.
thiserror = "2"
# Structured logging (a down source warns, never errors the page).
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC date components for the "last edited" line (std only — no C deps).
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token + hex encoding (same as inkwell).
getrandom = "0.2"
hex = "0.4"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
sha2 = "0.10"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the same
# statements later run unchanged on FusionDB over pgwire. Atlas owns the `services` annotations
# table AND reads the gateway `routes` table READ-ONLY via a separate lazily-connected pool.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
