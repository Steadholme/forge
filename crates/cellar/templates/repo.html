<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{NAME}} · Cellar · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">{{USERBOX}}</header>

  <main class="console">
    <div class="console__head console__head--row">
      <div>
        <h1 class="detail-title">{{NAME}}</h1>
        <p class="sub">Tags in this repository and the manifest each one points at.</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/">All repositories</a>
    </div>

    <div class="cmd-strip">
      <span class="cmd-label">Pull</span>
      <code>{{PULL_CMD}}</code>
    </div>

    <div class="section-head">
      <h2>Tags</h2>
      <span class="count-badge">{{COUNT}}</span>
    </div>

    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Manifest digest</th>
            <th>Media type</th>
            <th>Size</th>
            <th>Updated</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {{TAG_ROWS}}
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-foot">
    <span>HOLDFAST · Cellar</span>
    <span>Container registry · part of the HOLDFAST estate</span>
  </footer>
</body>
</html>
