<!DOCTYPE html>
<html lang="en"{{THEME}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>{{NAME}} · Cellar · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console" data-wire-nav="#cl-main">
  <header class="appbar">{{USERBOX}}</header>

  <main class="console" id="cl-main">
    <div class="console__head console__head--row">
      <div>
        <h1 class="detail-title">{{NAME}}</h1>
        <p class="sub">Tags in this repository and the manifest each one points at.</p>
        <p class="sub">{{PULLS}}</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/">All repositories</a>
    </div>

    <div class="cmd-strip cl-endpoint">
      <span class="cmd-label">Pull</span>
      <code>{{PULL_CMD}}</code>
      <button class="btn btn-ghost btn-sm copy-btn" type="button" data-copy aria-label="Copy pull command">Copy</button>
    </div>

    <div class="section-head">
      <h2>Tags</h2>
      <span class="count-badge">{{COUNT}}</span>
    </div>

    <div class="table-wrap cl-list">
      <table class="data" data-sortable>
        <thead>
          <tr>
            <th data-sort="text">Tag</th>
            <th data-sort="text">Manifest digest</th>
            <th data-sort="text">Media type</th>
            <th data-sort="num">Size</th>
            <th data-sort="num">Updated</th>
            <th data-nosort></th>
          </tr>
        </thead>
        <tbody data-motion-list>
          {{TAG_ROWS}}
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-foot">
    <span>HOLDFAST · Cellar</span>
    <span>Container registry · part of the HOLDFAST estate</span>
  </footer>
  <script>{{JS}}</script>
</body>
</html>
