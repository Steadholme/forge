<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{NAME}} · Cellar · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="HOLDFAST Registry">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
      </a>
      <div class="topbar__right">{{USERBOX}}</div>
    </div>
  </header>

  <main class="console">
    <div class="console__head console__head--row">
      <div>
        <h1 class="detail-title">{{NAME}}</h1>
        <p class="sub">{{SUBTITLE}}</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/r/{{NAME}}">Back to repository</a>
    </div>

    <div class="cmd-strip">
      <span class="cmd-label">Pull</span>
      <code>{{PULL_CMD}}</code>
    </div>

    <div class="section-head">
      <h2>Manifest</h2>
      <span class="count-badge">{{KIND}}</span>
    </div>

    <div class="table-wrap">
      <table class="data">
        <tbody>
          <tr><td class="muted">Digest</td><td class="mono">{{DIGEST}}</td></tr>
          <tr><td class="muted">Media type</td><td class="muted">{{MEDIA_TYPE}}</td></tr>
          <tr><td class="muted">Size</td><td class="num">{{SIZE}}</td></tr>
          <tr><td class="muted">Tags</td><td>{{TAGS}}</td></tr>
        </tbody>
      </table>
    </div>

    {{CONTENT}}
  </main>
</body>
</html>
