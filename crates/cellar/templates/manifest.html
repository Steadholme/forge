<!DOCTYPE html>
<html lang="en"{{THEME}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>{{NAME}} · Cellar · Steadholme</title>
  <link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body class="page-v2" data-wire-nav="#cl-main">
<a class="skip-link" href="#main">Skip to main content</a>
  <header class="suitebar">{{USERBOX}}</header>

  <main class="v2-page" id="main" tabindex="-1">
    <div class="pagehead">
      <div class="pagehead__titles">
        <div class="cl-masthead-lead">
          <span class="letter-tile cl-tile" aria-hidden="true">{{LAYERS}}</span>
          <div>
            <h1 class="detail-title">{{NAME}}</h1>
          </div>
        </div>
        <p class="sub">{{SUBTITLE}}</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/r/{{NAME}}">Back to repository</a>
    </div>

    {{STATS}}

    <div class="cmd-strip cl-endpoint">
      <span class="cmd-label">Pull</span>
      <code>{{PULL_CMD}}</code>
      <button class="btn btn-ghost btn-sm copy-btn" type="button" data-copy aria-label="Copy pull command">Copy</button>
    </div>

    <div class="cl-idcard">
      <div class="cl-idcard__item">
        <span class="cl-idcard__label">Digest</span>
        <div class="cl-idcard__digest"><code>{{DIGEST}}</code><button class="btn btn-ghost btn-sm copy-btn" type="button" data-copy="{{DIGEST}}" aria-label="Copy manifest digest">Copy</button></div>
      </div>
      <div class="cl-idcard__item">
        <span class="cl-idcard__label">Media type</span>
        <span class="chip chip--outline">{{MEDIA_TYPE}}</span>
      </div>
      <div class="cl-idcard__item">
        <span class="cl-idcard__label">Size</span>
        <span class="pill pill-size">{{SIZE}}</span>
      </div>
      <div class="cl-idcard__item">
        <span class="cl-idcard__label">Tags</span>
        <span>{{TAGS}}</span>
      </div>
    </div>

    {{CONTENT}}
  </main>
  <script>{{JS}}</script>
  <footer class="v2-foot">
    <span class="v2-foot__lead">Steadholme · Cellar · registry.w33d.xyz</span>
    <a href="https://distribution.github.io/distribution/spec/api/">Docker Registry V2</a>
    <a href="https://id.w33d.xyz">Keystone SSO</a>
    <a href="https://status.w33d.xyz">Status</a>
    <a href="https://w33d.xyz">All apps</a>
  </footer>
</body>
</html>
