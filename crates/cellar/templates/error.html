<!DOCTYPE html>
<html lang="en"{{THEME}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>{{STATUS}} · Cellar · Steadholme</title>
  <link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body class="page-console">
  <header class="appbar">{{USERBOX}}</header>

  <main class="console">
    <section class="card card--message">
      <div class="card__body">
        <div class="status-code">{{STATUS}}</div>
        <h1 class="message-heading">{{HEADING}}</h1>
        <p class="message-body">{{MESSAGE}}</p>
        <a class="btn btn-primary" href="/">Back to Registry</a>
      </div>
    </section>
  </main>
  <footer class="v2-foot">
    <span class="v2-foot__lead">Steadholme · Cellar · registry.w33d.xyz</span>
    <a href="https://distribution.github.io/distribution/spec/api/">Docker Registry V2</a>
    <a href="https://id.w33d.xyz">Keystone SSO</a>
    <a href="https://status.w33d.xyz">Status</a>
    <a href="https://w33d.xyz">All apps</a>
  </footer>
</body>
</html>
