[package]
name = "cellar"
version = "0.1.0"
edition = "2021"
description = "Cellar — an OCI / Docker Registry HTTP API V2 container registry for the HOLDFAST stack (SSO web UI; Basic-auth /v2/ protocol; content-addressed blobs on a volume, metadata in Postgres)."
license = "MIT OR Apache-2.0"

[lib]
name = "cellar"
path = "src/lib.rs"

[[bin]]
name = "cellar"
path = "src/main.rs"

[dependencies]
# Odyssey canonical design-system CSS (vendored, path dep). Cellar's own service.css layers after it.
odyssey = { path = "../odyssey" }
# HTTP framework shared with the rest of the estate.
axum = "0.8"
# Async runtime axum runs on. The Store and BlobStore traits are async: handlers `.await` them
# on the serving runtime; PgStore drives sqlx natively and FsBlobStore uses tokio::fs — a worker
# thread is NEVER blocked (no block_in_place, no sync-over-async bridge). `fs` enables async file
# I/O for the content-addressed blob volume + upload sessions.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
# Erase the async trait methods so `Arc<dyn Store>` / `Arc<dyn BlobStore>` stay object-safe.
async-trait = "0.1"
# `_catalog` / `tags/list` JSON bodies + parsing manifest JSON to compute an image's size.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enums.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the "pushed" timestamps (std only — no extra C deps).
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG (OsRng) for the upload-session uuid + the double-submit CSRF token.
rand = "0.8"
# Portable PostgreSQL metadata layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (ring) — no openssl. The same standard SQL
# later runs unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# Content addressing: the SHA-256 of a blob/manifest IS its digest (`sha256:<hex>`). Pure-Rust
# (ring-free) — no openssl, matching the estate's crypto stack.
sha2 = "0.10"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
