[package]
name = "loom"
version = "0.1.0"
edition = "2021"
description = "Loom — self-hosted git forge for the HOLDFAST stack (SSO web UI + git smart-HTTP with PAT auth)."
license = "MIT OR Apache-2.0"

[lib]
name = "loom"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with keystone/cairn/pastefire): Method/Path/State/Query extractors,
# raw-body (Bytes) extraction for the git smart-HTTP packs, server-rendered HTML.
axum = "0.8"
# Async runtime axum runs on. `process` spawns `git`/`git-http-backend` as async children (stdin
# written concurrently with stdout read, so a large push never deadlocks the pipe); `io-util`
# for AsyncWriteExt. The Store trait is async: handlers `.await` it directly and PgStore uses
# sqlx natively, so a worker thread is NEVER blocked (no block_in_place, no sync-over-async).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "fs", "net", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the
# rest of the estate).
async-trait = "0.1"
# Deserialize the HTML form bodies; serde_json kept for parity with the estate error envelope.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enums.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the created/commit timestamps (std only — no extra C deps).
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
# CSPRNG (OsRng) for the random repo/issue/pat ids, the PAT secret, and the double-submit CSRF
# token. rand 0.8 matches keystone's OsRng path.
rand = "0.8"
# PAT hashing: SHA-256 of the personal-access-token, so only the hash is stored (never the
# token). RustCrypto — pure Rust, no OpenSSL (matches cairn's posture). `hex` renders the digest.
sha2 = "0.10"
hex = "0.4"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
# Decode the HTTP Basic `Authorization` header on the /git/ smart-HTTP routes (username:PAT).
# base64 0.22 matches keystone/corvid/sanctum.
base64 = "0.22"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). The same standard SQL later
# runs unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# Sanitised CommonMark rendering for README.md + issue bodies. Same version/features as the
# estate's content crates (agora/echo/inkwell): raw HTML is downgraded to text and unsafe link
# schemes are defused over the event stream before serialisation — pure Rust, no C deps.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
