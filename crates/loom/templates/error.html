<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>{{STATUS}} · Loom · Steadholme</title>
  <link rel="stylesheet" href="/assets/loom-20260907.css">
</head>
<body class="page-console page-loom">
  <header class="appbar"><div class="appbar__inner">{{USERBOX}}</div></header>

  <main class="console">
    <section class="card card--message">
      <div class="card__body">
        <div class="status-code">{{STATUS}}</div>
        <h1 class="message-heading">{{HEADING}}</h1>
        <p class="message-body">{{MESSAGE}}</p>
        <a class="btn btn-primary" href="/">Back to Loom</a>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="site-foot__inner">
      <span class="site-foot__brand">Steadholme · Loom</span>
      <nav class="site-foot__links" aria-label="Estate">
        <a href="https://status.w33d.xyz/status">Status</a>
        <a href="https://w33d.xyz">All apps</a>
      </nav>
    </div>
  </footer>
</body>
</html>
